name: OpenMerge Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, migrate, lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://openmerge:openmerge@localhost:5432/openmerge_ci?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openmerge
          POSTGRES_PASSWORD: openmerge
          POSTGRES_DB: openmerge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bun run validate
        working-directory: packages/database

      - name: Generate Prisma client
        run: bun run generate
        working-directory: packages/database

      - name: Apply migrations to a clean database
        run: bun run db:migrate:deploy
        working-directory: packages/database

      - name: Run lint
        run: bun run lint

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Run build
        run: bun run build
