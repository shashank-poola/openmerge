services:
  postgres:
    image: postgres:16
    container_name: pullrabbit-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: pullrabbit
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pullrabbit_db
      POSTGRES_HOST_AUTH_METHOD: md5
    command: ["postgres", "-c", "password_encryption=md5"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pullrabbit-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
